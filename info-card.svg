<svg xmlns="http://www.w3.org/2000/svg" width="480" height="376" viewBox="0 0 480 376" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<style><![CDATA[
@keyframes rise { from { opacity: 0; transform: translateY(6px) }
                  to   { opacity: 1; transform: none } }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes throb{ 0%, 100% { opacity: 1 } 50% { opacity: 0.1 } }
.r  { animation: rise .4s ease-out both }
.sw { animation: fade .3s ease-out both }
.dot{ animation: throb 1.6s ease-in-out infinite }
@media (prefers-reduced-motion: reduce) {
  .r, .sw, .dot { animation: none }
}
]]></style>
