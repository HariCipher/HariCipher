<style><![CDATA[
@keyframes weave { from { stroke-dashoffset: 100 } to { stroke-dashoffset: 0 } }
@keyframes fade  { from { opacity: 0 } to { opacity: 1 } }
@keyframes sway  { 0%, 100% { transform: translateX(0) }
